<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VS // CONSOLE</title>
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('vs-theme');
        } catch (e) {}
        if (saved === 'samaritan') {
          document.documentElement.setAttribute('data-theme', 'samaritan');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
