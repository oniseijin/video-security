[storage]
db_path = "~/.video-security/db"
artifact_dir = "/Volumes/lacie8/video/vs"
# staging_dir = null  (optional local in-transit dir)

[import]
card_mount = "/Volumes/CX-8"
archive_dirs = ["/Volumes/lacie8/video/CX-8"]
preflight_gb = 25

[adapter.mazda_cx8]
timezone = "Asia/Tokyo"
[adapter.mazda_cx8.priority]
EVENT = 1.0
PARKING = 0.8
MANUAL = 0.7
NORMAL = 0.3
[adapter.mazda_cx8.gsens]
hard_brake_g = 0.35
hard_corner_g = 0.30
impact_g = 0.80

[adapter.photos]
# Set enabled = false to hard-block photos imports (vs import refuses
# with an error, both for --adapter photos and auto-detected libraries).
enabled = true

[engine]
heartbeat_sec = 30
max_llm_events = 100
retention_days = 30
disk_preflight_gb = 10
disk_watermark_gb = 5

[llm]
# provider = "ollama" | "mlx-serve" (default: ollama)
# ollama_url = "http://localhost:11434"
# mlx_url = "http://127.0.0.1:11234"

[llm.triage]
model = "gemma3:4b"
num_ctx = 2048
timeout_s = 120

# Per-provider model names — the active provider's entry overrides `model`
# at config load, so switching [llm] provider is a one-line rollback.
[llm.triage.models]
# "mlx-serve" = "mlx-community/gemma-4-e4b-it-4bit"

[llm.detail]
model = "gemma4:12b"
num_ctx = 8192
timeout_s = 300
# On primary-model failure (e.g. the 12b KV-gate under daytime memory
# pressure), detail retries the event with the TRIAGE stage's model for the
# rest of the sweep (sticky), recording that model in the result digest.

[llm.embed]
model = "nomic-embed-text"
timeout_s = 120

# Semantic-search embeddings (vs index, web-api search). Search is
# model-scoped: a query embeds once with the active provider's model and
# matches only that model's rows — mixed-model stores stay safe.
[llm.embed.models]
# "mlx-serve" = "mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ"

[llm.detail.models]
# "mlx-serve" = "mlx-community/gemma-4-12b-it-4bit"

[cloud]
# Opt-in OpenAI-compatible cloud endpoint (eval comparison via
# `vs eval --backend cloud`; nothing in the nightly pipeline ever calls
# it). Disabled and capped at $0 by default — cloud is refused until
# both are set.
enabled = false
# base_url = "https://api.example.com"  (endpoint root; client posts to {base_url}/v1/chat/completions)
# model = ""
# The API key lives in the environment ONLY, never in any toml file:
#   export VS_CLOUD_API_KEY="..."
# api_key_env = "VS_CLOUD_API_KEY"  (name of the env var holding the key)
monthly_budget_usd = 0.0
# Prices for the per-call cost estimate and the cloud_calls ledger:
price_per_1m_input_tokens = 0.0
price_per_1m_output_tokens = 0.0
price_per_image = 0.0

[whisper]
model = "small"
# language = "ja"  (pin if monolingual)

[prefilter]
scene_text_sample_sec = 30
motion_threshold = 0.05
scene_change_hash_dist = 12
night_luma = 60
ir_max_sat = 20
decode_width = 1280
yolo_model = "yolov8n"
yolo_conf = 0.25
# yolo_coreml_path = "/path/to/exported.mlpackage"  (ANE)
ocr_min_conf = 0.3
plate_min_votes = 2

[audio]
rms_window_ms = 100
rms_sustain_ms = 500
rms_factor = 4.0
rms_floor = 0.02
vad_pad_ms = 300
distress_keywords = ["help", "police", "get out"]

[threat]
score_threshold = 0.5
person_weight = 0.4
motion_weight = 0.3
time_weight = 0.3
after_hours = ["22:00-06:00"]
loiter_min_sec = 60
merge_gap_sec = 5
[threat.priority]
intrusion = 0.9
loitering = 0.6
suspicious_behavior = 0.5

[crash]
# Crash/impact detection (G-sensor + jolt + audio transient + GPS speed drop).
# Keep enabled = false until candidates from `vs crash-scan` have been
# human-reviewed via the provenance panel.
enabled = false
jolt_sigma = 6.0
audio_sigma = 5.0
# A hit must reach this sigma to confirm a G-sensor candidate (base
# audio_sigma hits still count in the no-G 2-of-3 path). Calibrate via
# `vs crash-scan --calibrate`.
audio_confirm_sigma = 7.5
speed_drop_kmh = 25.0
window_sec = 3.0
min_signals = 2

[map]
# carto_api_key = "cb1_..."  (optional — unlocks CARTO basemap features/higher tile limits; local config only)

[web]
host = "127.0.0.1"
port = 8377
# native_report = false  (optional — set false for the classic iframe Report tab; the
#                         native React report is the default since v0.14.0)