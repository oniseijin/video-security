# Committed format example for `vs eval` case files.
# Ids below are synthetic (tests seed matching fixtures). Real case
# files reference real footage ids and are personal data: keep them
# local-only (default ~/.video-security/eval/cases.toml), never commit.

[[case]]
job_id = 1
event_id = 1
stratum = "night"
note = "synthetic: person at the door after hours"
[case.expected]
relevant = true
event_type = "intrusion"
confidence = "high"

[[case]]
