[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-security"
version = "0.1.0"
description = "Local, resumable security camera footage analysis CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "Pillow>=10.0",
    "silero-vad>=5.1",
    "mlx-whisper>=0.4",
    "pyobjc-framework-Vision>=10.0",
]

[project.scripts]
vs = "video_security.entries:vs_main"
vs-analyze = "video_security.entries:analyze"
vs-import = "video_security.entries:import_clips"
vs-search = "video_security.entries:search"
vs-report = "video_security.entries:report"
vs-list = "video_security.entries:list_jobs"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["video_security"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
